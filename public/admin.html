<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Marista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="ph ph-shield-check text-yellow-400"></i> Gestión de Usuarios
        </h1>
        <a href="index.html" class="text-sm hover:text-blue-200 flex items-center gap-1">
            <i class="ph ph-arrow-left"></i> Volver al Dashboard
        </a>
    </nav>

    <div class="container mx-auto mt-8 px-4">
        
        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Usuarios Registrados</h2>
                <span class="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-bold">Admin View</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider">
                            <th class="p-4 border-b">Usuario</th>
                            <th class="p-4 border-b">Rol</th>
                            <th class="p-4 border-b">Estado</th>
                            <th class="p-4 border-b">Último Acceso</th>
                            <th class="p-4 border-b text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="text-gray-700 text-sm">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-400">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) window.location.href = 'login.html';

            try {
                const res = await fetch('/api/auth/users', {
                    headers: { 'Authorization': `Bearer ${token}` } // Si usas middleware
                });
                const users = await res.json();
                
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    // Formatear fecha
// 1. LÓGICA INTELIGENTE DE FECHA
    let dateDisplay = '<span class="text-gray-400 italic">Nunca</span>'; // Por defecto
    
    // Solo si existe lastLogin Y no es la fecha de creación por defecto
    if (user.lastLogin) {
        const loginDate = new Date(user.lastLogin);
        const now = new Date();
        
        // Verificamos si la fecha es válida
        if (!isNaN(loginDate.getTime())) {
            dateDisplay = loginDate.toLocaleString('es-VE', { 
                day: '2-digit', month: '2-digit', year: 'numeric', 
                hour: '2-digit', minute: '2-digit' 
            });
        }
    }

    // 2. STATUS (Tu código de estilos que ya tenías)
    const statusClass = user.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
    const statusText = user.isActive ? 'Activo' : 'Suspendido';

    // 3. INYECTAR EL HTML (Fíjate donde puse ${dateDisplay})
    tbody.innerHTML += `
        <tr class="hover:bg-gray-50 transition border-b border-gray-100">
            <td class="p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-bold text-lg">
                    ${user.username.charAt(0).toUpperCase()}
                </div>
                <div>
                    <p class="font-bold text-gray-900">${user.username}</p>
                    <p class="text-xs text-gray-500">${user.email}</p>
                </div>
            </td>
            <td class="p-4">
               <span class="border border-gray-200 px-2 py-1 rounded text-xs font-semibold uppercase ${user.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-600'}">
                    ${user.role}
                </span>
            </td>
            <td class="p-4">
                <span class="${statusClass} px-2 py-1 rounded-full text-xs font-bold">
                    ${statusText}
                </span>
            </td>
            <td class="p-4 text-gray-600 font-mono text-xs">
                ${dateDisplay} </td>
            <td class="p-4 text-center">
                <button class="text-blue-600 hover:text-blue-800 font-medium text-sm transition">
                    Editar
                </button>
            </td>
        </tr>
    `;
                });
            } catch (error) {
                console.error(error);
                alert("Error cargando usuarios");
            }
        });
    </script>
</body>
</html>
